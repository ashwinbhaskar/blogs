<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" type="application/rss+xml" title="{{site_name}}" href="{{base}}/feed.xml">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:url" content="{{canonical}}">
<link rel="icon" href="{{base}}/site/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{base}}/site/site.css">
<script>
/* apply the saved theme before first paint so the page never flashes */
(function(){try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{base}}/">{{site_name}}</a>
    <nav class="nav" aria-label="Site">
      <a href="{{base}}/"{{nav_home_current}}>Posts</a>
      <a href="{{base}}/feed.xml">RSS</a>
      <a href="https://github.com/{{github}}/{{repo}}">GitHub</a>
      <button class="theme-toggle" type="button" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>Theme</span>
      </button>
    </nav>
  </div>
</header>
<main>
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>{{site_name}} · {{author}} · {{year}}</span>
    <span><a href="{{base}}/feed.xml">RSS</a> · <a href="https://github.com/{{github}}/{{repo}}">Source on GitHub</a></span>
  </div>
</footer>
<script src="{{base}}/site/site.js"></script>
</body>
</html>
